<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Bikki Kumar Rana, Full-Stack and AI Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#141C26" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58A6FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#58A6FF" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#0E1420"/>
    </linearGradient>
    <clipPath id="frame"><rect x="40" y="40" width="280" height="280"/></clipPath>
  </defs>

  <rect width="1000" height="360" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="360" rx="16" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="999" height="359" rx="16" fill="none" stroke="#1F2A37"/>

  <!-- Capture frame -->
  <g stroke="#58A6FF" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M40 78V40H78"/>
    <path d="M282 40H320V78"/>
    <path d="M40 282V320H78"/>
    <path d="M282 320H320V282"/>
  </g>

  <g clip-path="url(#frame)">
    <!-- silhouette -->
    <path d="M85 320Q85 232 180 220Q275 232 275 320Z" fill="#101823" stroke="#1B2A3C"/>
    <circle cx="180" cy="152" r="54" fill="#101823" stroke="#1B2A3C"/>

    <!-- landmarks -->
    <g fill="#8957E5">
      <circle cx="160" cy="142" r="3" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.3s" fill="freeze"/></circle>
      <circle cx="200" cy="142" r="3" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.3s" fill="freeze"/></circle>
      <circle cx="180" cy="162" r="3" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.3s" fill="freeze"/></circle>
      <circle cx="164" cy="182" r="3" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.3s" fill="freeze"/></circle>
      <circle cx="180" cy="187" r="3" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.3s" fill="freeze"/></circle>
      <circle cx="196" cy="182" r="3" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.3s" fill="freeze"/></circle>
      <circle cx="132" cy="150" r="2.5" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.3s" fill="freeze"/></circle>
      <circle cx="228" cy="150" r="2.5" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.3s" fill="freeze"/></circle>
      <circle cx="148" cy="196" r="2.5" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.3s" fill="freeze"/></circle>
      <circle cx="212" cy="196" r="2.5" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.3s" fill="freeze"/></circle>
    </g>
    <g stroke="#8957E5" stroke-width="1" opacity="0.5" fill="none">
      <path d="M160 142L200 142L180 162ZM164 182L180 187L196 182"/>
    </g>

    <!-- scan band + line -->
    <rect x="40" y="4" width="280" height="40" fill="url(#band)">
      <animate attributeName="y" values="4;282;4" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="40" y="40" width="280" height="2" fill="url(#scan)">
      <animate attributeName="y" values="40;318;40" dur="3.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- detection box -->
  <rect x="118" y="92" width="124" height="128" fill="none" stroke="#3FB950" stroke-width="1.5" stroke-dasharray="6 5" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.8s" dur="0.4s" fill="freeze"/>
    <animate attributeName="stroke-dashoffset" from="0" to="-22" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.4s" fill="freeze"/>
    <rect x="118" y="70" width="124" height="20" fill="#3FB950"/>
    <text x="180" y="84" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#06210E">FACE · VERIFIED</text>
  </g>

  <!-- Right side text -->
  <text x="370" y="92" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#58A6FF" letter-spacing="2" opacity="0">
    // SUBJECT IDENTIFIED
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
  </text>
  <text x="370" y="158" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="#F0F6FC" textLength="580" lengthAdjust="spacingAndGlyphs" opacity="0">
    BIKKI KUMAR RANA
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.7s" fill="freeze"/>
  </text>
  <text x="370" y="196" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#9DA7B3" opacity="0">
    Full-Stack + AI Developer
    <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.6s" fill="freeze"/>
  </text>

  <line x1="370" y1="222" x2="950" y2="222" stroke="#1F2A37"/>

  <g font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <text x="370" y="254" fill="#8B949E" opacity="0">&gt; liveness ...... <tspan fill="#3FB950" font-weight="700">PASS</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="0.4s" fill="freeze"/>
    </text>
    <text x="370" y="278" fill="#8B949E" opacity="0">&gt; stack ......... <tspan fill="#C9D1D9">Python · FastAPI · Next.js · OpenCV</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.4s" fill="freeze"/>
    </text>
    <text x="370" y="302" fill="#8B949E" opacity="0">&gt; status ........ <tspan fill="#C9D1D9">open to SDE / Full-Stack roles</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.4s" fill="freeze"/>
    </text>
    <rect x="745" y="290" width="9" height="16" fill="#58A6FF" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.5;0.51;1" dur="1.1s" begin="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
